<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
    body {
        margin: 0;
        padding: 0;
        font-family: 'Roboto', sans-serif;
        background: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        color: #333;
    }
    .container {
        max-width: 500px;
        padding: 20px;
    }
    .monster-img {
        width: 150px;
        margin-bottom: 20px;
    }
    h1 {
        font-size: 6rem;
        color: #ff6f3c;
        margin: 0;
    }
    h2 {
        font-size: 1.5rem;
        margin: 10px 0;
        color: #ff6f3c;
    }
    p {
        font-size: 1rem;
        margin-bottom: 20px;
    }
    .btn {
        display: inline-block;
        padding: 10px 20px;
        background: #333;
        color: #fff;
        text-decoration: none;
        border-radius: 25px;
        font-weight: bold;
        transition: background 0.3s;
    }
    .btn:hover {
        background: #ff6f3c;
    }
</style>
</head>
<body>
    <div class="container">
        <img src="monster.png" alt="Monster 404" class="monster-img">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Ooops, seems like this monster ate your page...</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
